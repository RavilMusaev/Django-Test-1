<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>{{ task.title }}</title></head>
<body>
    <h1>{{ task.title }}</h1>
    <p>{{ task.description }}</p>
    <p>Статус: {% if task.is_done %}выполнено{% else %}не выполнено{% endif %}</p>
    <p>{{ task.created_at }}</p>
    <a href="{% url 'crud:task_update' task.id %}">Редактировать</a>
    <a href="{% url 'crud:task_delete' task.id %}">Удалить</a>
    <a href="{% url 'crud:task_list' %}">К списку</a>
</body>
</html>
